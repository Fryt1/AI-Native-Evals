[project]
name = "ai-native-evals"
version = "0.1.0"
description = "Inspect AI evaluation suite for comparing AI-Native agents in Blender and Unreal Engine workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "inspect-ai==0.3.263",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
ai-native-evals = "ai_native_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_native_evals"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.entry-points.inspect_ai]
ai_native_evals = "ai_native_evals._registry"
