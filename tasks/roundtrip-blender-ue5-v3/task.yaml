id: roundtrip-blender-ue5-v3
version: 1
prompt_file: prompt.md
resources:
- id: game-engine
  kind: repository
  source: game_engine
  mount: game-engine
execution:
  agent: codex-dcc
  mcp_profile: blender-ue5-host
test_plan:
  version: 1
  checks:
  - id: locate-blender-scene
    phase: outcome
    evaluator: agent.artifact_locator.v1
    input:
      roots:
      - /workspace/output
    config:
      prompt: prompts/outcome/artifact-locator-v1.md
      artifact_kind: blender_scene
      expected_name: roundtrip-v3.blend
    required: true
    on_error: fail
  - id: verify-blender-state
    phase: outcome
    evaluator: script.blender_scene.v1
    input:
      artifact: locate-blender-scene.selected_artifact
    config:
      objects:
      - name: RoundtripV3Cube
        type: MESH
        location:
        - 0.0
        - 0.0
        - 3.0
    required: true
    on_error: fail
    depends_on:
    - locate-blender-scene
  - id: verify-ue5-state
    phase: outcome
    evaluator: script.ue5_state.v1
    config:
      expectations:
        actor_label: RoundtripV3Actor
        location:
          x: 0.0
          y: 0.0
          z: 300.0
        expected_components:
        - StaticMeshComponent0
        - RoundtripV3Mesh
        mesh_ref: /Engine/BasicShapes/Cube.Cube
        mesh_component: RoundtripV3Mesh
    required: true
    on_error: fail
  - id: process-observation
    phase: process
    evaluator: trace.process_analyzer.v1
    config:
      metrics:
      - tool_failures
      - retries
      - verification_before_finish
    required: false
    on_error: review
  hard_checks:
  - locate-blender-scene
  - verify-blender-state
  - verify-ue5-state
