id: codex-file-smoke
version: 1
prompt_file: prompt.md
resources: []
test_plan:
  version: 1
  quality_threshold: 0.8
  checks:
  - id: locate-hello-file
    phase: outcome
    evaluator: agent.artifact_locator.v1
    input:
      roots:
      - /workspace/output
    config:
      prompt: prompts/outcome/artifact-locator-v1.md
      artifact_kind: text_file
      expected_name: hello.txt
    required: true
    on_error: fail
  - id: hello-file-content
    phase: outcome
    evaluator: script.text_equals.v1
    input:
      artifact: locate-hello-file.selected_artifact
    config:
      expected_text: ai-native-codex-ok
    required: true
    on_error: fail
    depends_on:
    - locate-hello-file
  - id: hello-content-quality
    phase: quality
    evaluator: agent.quality_judge.v1
    input:
      artifact: hello-file-content.path
    config:
      prompt: prompts/quality/text-artifact-v1.md
      rubric: rubric.yaml
    required: false
    weight: 1.0
    on_error: review
    depends_on:
    - hello-file-content
  - id: hello-process
    phase: process
    evaluator: trace.process_analyzer.v1
    config:
      metrics:
      - tool_failures
      - retries
      - verification_before_finish
    required: false
    weight: 1.0
    on_error: review
    depends_on:
    - hello-file-content
rubric_file: rubric.yaml
