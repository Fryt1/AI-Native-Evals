<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AI-Native Eval Console</title>
    <script>
      // Apply the saved theme before first paint so the console never flashes.
      try {
        document.documentElement.dataset.theme = localStorage.getItem("eval-console-theme") === "dark" ? "dark" : "light";
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    </script>  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
