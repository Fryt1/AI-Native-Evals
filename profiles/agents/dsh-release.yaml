id: dsh-release
label: DSH
description: DeepSeek Harness CLI，通过标准 ACP 驱动。可用哪些宿主能力由 MCP profile 决定。
adapter: dsh-acp
image_repository: ai-native-dsh-agent
agent_version: 0.1.2-rc.1
build:
  dockerfile: docker/dsh-agent/Dockerfile.release
  version_arg: DSH_VERSION
protocol: acp
workdir: /workspace
# The ACP runner writes protocol messages; this parser reads them.
trace:
  parser: dsh-acp
entrypoint: node
command:
  - /run-config/dsh-acp-runner.mjs
  - ${TASK_PROMPT}
environment:
  DSH_HOME: /tmp/dsh-home
  DSH_EXECUTABLE: dsh
  DSH_SERVER_ARGS: '["--profile","acp"]'
  DSH_CWD: /workspace
  DSH_PERMISSION_MODE: danger-full-access
  DSH_MODEL: ${MODEL}
  DSH_REASONING_EFFORT: ${REASONING_EFFORT}
writable_paths:
  - /tmp/dsh-home
options:
  executable: dsh
  profile: acp
  permission_option_id: allow-once
  close_after_prompt: true
