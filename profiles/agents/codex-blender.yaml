id: codex-blender
label: Codex（Blender 专用）
description: 工作目录在 /workspace，通过 MCP 操作宿主机 Blender；不依赖项目快照。
adapter: codex
# The same image as every other Codex profile. Profiles differ by workdir and
# declared capabilities, not by what is installed -- MCP servers come from the
# run's MCP profile, never from the image.
image: ai-native-codex-agent:local
protocol: responses
# `/workspace` rather than a project mount: this profile drives a host
# application and needs no repository snapshot, so it stays usable for Tasks
# that declare `resources: []`.
workdir: /workspace
writable_paths:
  - /opt/codex-home
  - /workspace/output
capabilities:
  - filesystem
  - shell
  - mcp
  - blender
options:
  executable: codex
  sandbox: workspace-write
  ask_for_approval: never
  ephemeral: true
  skip_git_repo_check: true
