id: codex-dcc
label: Codex（含 Blender / UE5）
description: 工作目录在项目快照内，可通过 MCP 操作宿主机的 Blender 与 UE5。
adapter: codex
# Same image as `codex`; this profile differs by workdir and declared
# capabilities, not by what is installed.
image: ai-native-codex-agent:local
protocol: responses
workdir: /workspace/game-engine
writable_paths:
  - /opt/codex-home
capabilities:
  - filesystem
  - shell
  - mcp
  - blender
  - ue5
options:
  executable: codex
  sandbox: workspace-write
  ask_for_approval: never
  ephemeral: true
  skip_git_repo_check: true

