id: dsh-dev
label: DSH（源码构建）
description: >-
  从 dsh 源码构建的 DSH，身份是 commit。用于验证源码改动与自研插件，
  与发布版 dsh-release 并存以便对比。
adapter: dsh-acp
# A source build's identity is its commit, and that is what the tag carries:
# `src-c291e79`. Declaring it as the version keeps the tag derived rather than
# spelled out, so the two cannot disagree and the version picker works here too.
image_repository: ai-native-dsh-agent
agent_version: src-c291e79
# A source build: the checkout is found through paths.source_roots and the
# commit becomes the tag, because that is what identifies this build.
build:
  kind: source
  source: dsh_runtime
  dockerfile: docker/dsh-agent/Dockerfile
protocol: acp
workdir: /workspace
trace:
  parser: dsh-acp
entrypoint: node
command:
  - /run-config/dsh-acp-runner.mjs
  - ${TASK_PROMPT}
environment:
  DSH_HOME: /tmp/dsh-home
  DSH_EXECUTABLE: node
  # The source image launches the CLI through tsx rather than a published bin.
  DSH_SERVER_ARGS: '["--import","tsx/esm","/opt/dsh/apps/cli/src/bin.ts","--profile","acp"]'
  DSH_CWD: /opt/dsh
  DSH_PERMISSION_MODE: danger-full-access
  DSH_MODEL: ${MODEL}
  DSH_REASONING_EFFORT: ${REASONING_EFFORT}
# Plugins are copied from their own repository into the run's mounted config and
# composed by the host at startup, so a private package needs neither a publish
# step nor an image rebuild. The id resolves through paths.source_roots.
attach:
  - dsh
writable_paths:
  - /tmp/dsh-home
options:
  executable: node
  permission_option_id: allow-once
  close_after_prompt: true
