id: codex
label: Codex
description: OpenAI 的编码 Agent。工作目录在 /workspace，可用哪些宿主能力由 MCP profile 决定。
adapter: codex
# The tag is derived from the version, so the two cannot drift apart. Bumping
# `agent_version` and rebuilding produces a new image beside the old one rather
# than replacing it.
image_repository: ai-native-codex-agent
agent_version: 0.153.4
# Where this Agent's image comes from. The framework knows only this much: run
# this Dockerfile, pass the version, tag the result. How the Agent is installed
# -- a package, a tarball, a compiled checkout -- is the Dockerfile's business,
# and describing it here would put one Agent's packaging into shared vocabulary.
#
# The Dockerfile receives the version as CODEX_VERSION, named by `version_arg`
# because only the Dockerfile knows what its own build argument is called.
#
# `args` carries build arguments this Agent's Dockerfile needs beyond the
# defaults it declares. Codex copies Node and git out of the gateway image
# rather than installing them, which is why its Node base is that image and not
# the upstream one. A Dockerfile's ARG default is correct for the Dockerfile;
# this only overrides it where an Agent genuinely differs.
build:
  dockerfile: docker/codex-agent/Dockerfile
  version_arg: CODEX_VERSION
  args:
    NODE_BASE_IMAGE: ai-native-llm-gateway:local
protocol: responses
workdir: /workspace
# Codex writes a line-delimited JSON event stream; this parser reads it.
trace:
  parser: codex
writable_paths:
  - /opt/codex-home
options:
  executable: codex
  sandbox: workspace-write
  ask_for_approval: never
  ephemeral: true
  skip_git_repo_check: true
