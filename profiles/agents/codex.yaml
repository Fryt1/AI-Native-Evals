id: codex
label: Codex（纯文件）
description: 只做文件与命令操作，不访问宿主机 DCC。适合不需要 Blender / UE5 的测试。
adapter: codex
image: ai-native-codex-agent:local
protocol: responses
workdir: /workspace
writable_paths:
  - /opt/codex-home
capabilities:
  - filesystem
  - shell
  - mcp
options:
  executable: codex
  sandbox: workspace-write
  ask_for_approval: never
  ephemeral: true
  skip_git_repo_check: true
