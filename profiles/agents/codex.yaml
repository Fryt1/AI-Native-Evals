id: codex
label: Codex（纯文件）
description: 只做文件与命令操作，不访问宿主机 DCC。适合不需要 Blender / UE5 的测试。
adapter: codex
# The tag is derived from the version, so the two cannot drift apart. Bumping
# `agent_version` and rebuilding produces a new image beside the old one rather
# than replacing it.
image_repository: ai-native-codex-agent
agent_version: 0.153.4
protocol: responses
workdir: /workspace
writable_paths:
  - /opt/codex-home
capabilities:
  - filesystem
  - shell
  - mcp
options:
  executable: codex
  sandbox: workspace-write
  ask_for_approval: never
  ephemeral: true
  skip_git_repo_check: true
