# AI-Native-Evals global registry. Task-owned definitions live under tasks.
version: 1
task_roots:
- tasks
profile_roots:
  agents: profiles/agents
  models: profiles/models
  mcp: profiles/mcp
  sandboxes: profiles/sandboxes
  presets: config/presets
paths:
  source_roots:
    game_engine: ../game-engine
    dsh: ../AI-Native-DSH
    dsh_runtime: ../dsh
  runs_root: ../EvalRuns
defaults:
  agent: codex
  evaluator_agent: codex
  model_profile: sub2api-deepseek
  mcp_profile: none
  snapshot_mode: working_tree
  sandbox_profile: docker-default
