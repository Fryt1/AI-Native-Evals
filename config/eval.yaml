version: 1

# Paths are resolved relative to the repository root, not this file.
paths:
  game_engine: ../game-engine
  dsh: ../AI-Native-DSH
  runs_root: ../EvalRuns

sandbox:
  backend: wsl-docker
  distro: Ubuntu-20.04
  gateway_image: ai-native-llm-gateway:local
  read_only_root: true
  memory: 8g
  pids_limit: 512

defaults:
  agent: codex
  model_profile: sub2api-deepseek
  mcp_profile: none
  snapshot_mode: working_tree

model_profiles:
  sub2api-deepseek:
    model: deepseek/deepseek-v4-flash
    protocol: responses
    reasoning_effort: high

agents:
  codex:
    image: ai-native-codex-agent:local
  codex-dcc:
    image: ai-native-codex-agent:all-mcp
  codex-all:
    image: ai-native-codex-agent:all-mcp
  dsh:
    image: ai-native-dsh-agent:local

mcp_profiles:
  none:
    servers: {}

  blender-host:
    host: host.docker.internal
    port: 9876
    servers:
      blender:
        transport: stdio
        command: /opt/blender-mcp/bin/blender-mcp
        env:
          BLENDER_MCP_HOST: ${MCP_HOST}
          BLENDER_MCP_PORT: ${MCP_PORT}

  ue5-host:
    host: host.docker.internal
    port: 8000
    servers:
      unreal-mcp:
        transport: streamable-http
        url: http://${MCP_HOST}:${MCP_PORT}/mcp
        startup_timeout_sec: 30
        tool_timeout_sec: 900

  blender-ue5-host:
    host: host.docker.internal
    port: 9876
    servers:
      blender:
        transport: stdio
        command: /opt/blender-mcp/bin/blender-mcp
        env:
          BLENDER_MCP_HOST: ${MCP_HOST}
          BLENDER_MCP_PORT: ${MCP_PORT}
      unreal-mcp:
        transport: streamable-http
        url: http://${MCP_HOST}:8000/mcp
        startup_timeout_sec: 30
        tool_timeout_sec: 900

  comfyui-host:
    host: host.docker.internal
    port: 8188
    servers:
      comfyui:
        transport: stdio
        command: /opt/comfy-mcp/bin/comfy-mcp
        cwd: /workspace/game-engine
        env:
          COMFY_BIN: /opt/comfy-mcp/bin/comfy
          COMFYUI_URL: http://${MCP_HOST}:${MCP_PORT}
          COMFY_LOCAL_URL: http://${MCP_HOST}:${MCP_PORT}
          COMFY_WHERE: local

  research-host:
    servers:
      huggingface:
        transport: streamable-http
        url: https://huggingface.co/mcp?login
        startup_timeout_sec: 30
        tool_timeout_sec: 300

  all-host:
    host: host.docker.internal
    port: 9876
    servers:
      blender:
        transport: stdio
        command: /opt/blender-mcp/bin/blender-mcp
        env:
          BLENDER_MCP_HOST: ${MCP_HOST}
          BLENDER_MCP_PORT: ${MCP_PORT}
      unreal-mcp:
        transport: streamable-http
        url: http://${MCP_HOST}:8000/mcp
        startup_timeout_sec: 30
        tool_timeout_sec: 900
      comfyui:
        transport: stdio
        command: /opt/comfy-mcp/bin/comfy-mcp
        cwd: /workspace/game-engine
        env:
          COMFY_BIN: /opt/comfy-mcp/bin/comfy
          COMFYUI_URL: http://${MCP_HOST}:8188
          COMFY_LOCAL_URL: http://${MCP_HOST}:8188
          COMFY_WHERE: local
      huggingface:
        transport: streamable-http
        url: https://huggingface.co/mcp?login
        startup_timeout_sec: 30
        tool_timeout_sec: 300

tasks:
  roundtrip-blender-ue5-v2:
    agent: codex-dcc
    mcp_profile: blender-ue5-host
    prompt: >-
      Work across two DCCs through MCP and leave verifiable state on the host.
      Blender (server 'blender'): create an object named RoundtripV2Cube (a unit cube)
      at (0,0,2). Then save the current Blender scene to a file named
      roundtrip-v2.blend inside the evidence directory (the Windows host path that is
      mounted into this container at /workspace/evidence, usually
      D:\work\AI-Native\EvalRuns\<run-id>\evidence) and call save/export so the
      file exists.
      UE5 (server 'unreal-mcp'): in the current level create a StaticMeshActor
      named RoundtripV2Actor at (0,0,200), and add a cube StaticMeshComponent named
      RoundtripV2Mesh using the engine's built-in cube mesh.
      Finally write /workspace/evidence/roundtrip-v2-summary.json containing both the
      saved blender file path and the actor ref from UE5, then report done.
    verify:
      blender_scene: roundtrip-v2.blend
      blender_objects:
        - name: RoundtripV2Cube
          type: MESH
          location: [0.0, 0.0, 2.0]
      ue5:
        actor_label: RoundtripV2Actor
        location: {x: 0.0, y: 0.0, z: 200.0}
        expected_components: [StaticMeshComponent0, RoundtripV2Mesh]
        mesh_ref: /Engine/BasicShapes/Cube.Cube
        mesh_component: RoundtripV2Mesh
  roundtrip-blender-ue5:
    agent: codex-dcc
    mcp_profile: blender-ue5-host
    prompt: >-
      Work across two DCCs through MCP and leave verifiable state on the host.
      Blender (server 'blender'): create an object named RoundtripCube (a unit cube)
      at (0,0,1). Then save the current Blender scene to a file named
      roundtrip.blend inside the evidence directory (the Windows host path that is
      mounted into this container at /workspace/evidence, usually
      D:\work\AI-Native\EvalRuns\<run-id>\evidence) and call save/export so the
      file exists.
      UE5 (server 'unreal-mcp'): in the current level create a StaticMeshActor
      named RoundtripActor at (0,0,100), and add a cube StaticMeshComponent named
      RoundtripMesh using the engine's built-in cube mesh.
      Finally write /workspace/evidence/roundtrip-summary.json containing both the
      saved blender file path and the actor ref from UE5, then report done.
    verify:
      blender_scene: roundtrip.blend
      blender_objects:
        - name: RoundtripCube
          type: MESH
          location: [0.0, 0.0, 1.0]
      ue5:
        actor_label: RoundtripActor
        location: {x: 0.0, y: 0.0, z: 100.0}
        expected_components: [StaticMeshComponent0, RoundtripMesh]
        mesh_ref: /Engine/BasicShapes/Cube.Cube
        mesh_component: RoundtripMesh
  blender-cube:
    agent: codex-dcc
    mcp_profile: blender-host
    prompt: >-
      Create a small cube in the currently running Blender instance through the
      configured Blender MCP tools. Save a verification artifact under
      /workspace/evidence/blender-cube.json, and verify the cube exists before
      reporting completion. Do not use shell scripts or a custom socket client
      to control Blender.
  codex-file-smoke:
    prompt: >-
      Create /workspace/evidence/hello.txt with exactly the text
      ai-native-codex-ok, then read it back and verify the contents.
    test_plan:
      version: 1
      checks:
        - id: locate-hello-file
          phase: outcome
          evaluator: agent.artifact_locator.v1
          input:
            roots:
              - /workspace/evidence
          config:
            artifact_kind: text_file
            expected_name: hello.txt
          required: true
          on_error: fail
        - id: hello-file-content
          phase: outcome
          evaluator: script.text_equals.v1
          input:
            artifact: locate-hello-file.selected_artifact
          config:
            expected_text: ai-native-codex-ok
          required: true
          on_error: fail
          depends_on:
            - locate-hello-file
