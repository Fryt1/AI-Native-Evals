# Stability of one Agent on one Task: is a pass reproducible, or was it luck?
#
# A single vary axis with one value is not a degenerate case -- it is the
# experiment you run after seeing a `pass`, to find out whether it repeats.
# Because `vary` still names `agent`, the report includes the pass rate and its
# interval rather than a bare "it passed".
id: dsh-stability
description: 单个 Agent 在同一 Task 上的稳定性，检验一次 pass 是否可复现
task_id: codex-file-smoke
vary:
  agent:
    - dsh-release
fixed:
  model: gpt-5.6-luna
  reasoning_effort: high
  mcp_profile: none
  sandbox_profile: docker-default
repeats: 10
